# Defaults for tools/eval_beat.py, and the project-wide postprocessing defaults
# (musicality.evaluation.DEFAULTS, tools/annotator/inference.py).
# Every key is documented in docs/source/configuration.rst — put explanations
# there, not here. Every key is overridable via the matching --flag.
# --- Run ----------------------------------------------------------------
dataset: merge
split: val  # train | val | all
val_split: 0.2  # must match how the split was created
binary_only: true  # must match how the split was created
sample_rate: 22050  # must match the checkpoint's training config
hop_length: 512  # must match the checkpoint's training config
tolerance: 0.07  # F-measure matching window, seconds
device: cpu
# --- Postprocessing, per task -------------------------------------------
# Selected automatically by musicality.inference.detect_task.
beat_only:
  # Tuned via --sweep: mean beat F-measure 0.735 -> 0.896.
  beat_threshold: 0.8
  min_distance_frames: 4
  gate_tolerance: 0.1
beat_phase:
  # !! The four beat-detection knobs below are UNVERIFIED — they were swept
  # against a head and a decoder this config no longer trains. Re-sweep before
  # trusting them; see docs/source/configuration.rst.
  beat_threshold: 0.5
  min_distance_frames: 4
  gate_tolerance: 0.1
  group_size: 4  # 4 = bar position, 8 = phrase position
  decoder: global  # global | greedy
  switch_penalty: 2.0  # global only; null forbids mid-track resyncs
  anchor_threshold: 0.8  # greedy only
# --- Sweep grid ---------------------------------------------------------
# Two-stage: beat knobs first, then the bar-position knob on top of the winner.
sweep:
  top: 10
  split: train  # tools/leaderboard.py: which split the knobs are tuned on
  tracks: 50  # tools/leaderboard.py: stratified subsample of that split
  beat_thresholds: [0.2, 0.4, 0.5, 0.6, 0.8]
  min_distance_frames: [1, 2, 4]
  gate_tolerances: [0.1, 0.15, 0.2, 0.3]
  anchor_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9]  # decoder: greedy only
  switch_penalties: [0.25, 1.0, 2.0, 5.0, 20.0]  # decoder: global only; also the --decoders list
