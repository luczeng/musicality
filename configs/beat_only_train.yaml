# Beat-only training (tools/train_beat_only.py).
# Every key is documented in docs/source/configuration.rst — put explanations
# there, not here. Trailing comments list legal values only.
defaults:
  - model: tcn_frames_beat
  - _self_

task: beat_only
# --- Head ---------------------------------------------------------------
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# --- Loss ---------------------------------------------------------------
pos_weight: 6.0  # ~6:1 negative:positive on ballroom
balanced: true  # unused by this task; kept because it is stored in every checkpoint
# --- Optimisation -------------------------------------------------------
lr: 5e-4
weight_decay: 1e-4
batch_size: 2
trainer:
  max_epochs: 100
  accelerator: auto  # cpu | gpu | auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
# --- Data ---------------------------------------------------------------
# binary_only is folded into the split name, so it must match the split it is
# read with (`--binary-only` on tools/create_splits.py).
binary_only: false
train_subsample: null  # fraction of the training split, for smoke runs
data:
  input: ballroom  # split name, or a path containing "/" to a train.txt/val.txt folder
  sample_rate: 22050
  duration: 16.0  # seconds
  num_workers: 4
  random_crop: true  # train only; val is always a fixed window from the middle
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
# --- Logging and outputs ------------------------------------------------
checkpoint_dir: checkpoints_beat_only/  # one subdirectory per run below this
wandb:
  project: musicality-beat-only
  run_name: null
  tags: []
