# Beat-phase training (tools/train_beat.py).
# Every key is documented in docs/source/configuration.rst — put explanations
# there, not here. Trailing comments list legal values only.
defaults:
  - model: tcn_frames
  - eval_beat@eval
  - _self_
task: beat_phase
# --- Head ---------------------------------------------------------------
phase_conditioning: beat  # mask | beat
target_layout: positions  # one_last | positions
group_size: 4  # 4 = bar position, 8 = phrase position
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# --- Loss ---------------------------------------------------------------
# pos_weight is coupled to target_layout: `positions` takes a scalar or `auto`,
# `one_last` takes [5, 4, 4]. Mixing them fails obscurely — see the docs.
pos_weight: auto
pos_weight_alpha: 1.11
position_norm: per_item  # global | per_item
# `shift_tolerant` replaces the sigma_frames smear above rather than adding to
# it, so switching it on wants sigma_frames: 0 as well. The two below are read
# by `loss: shift_tolerant` only.
loss: bce  # bce | shift_tolerant
tolerance_frames: 3  # ±70 ms at 43.07 fps, the metric's own tolerance
ignore_frames: 4  # null = 2 * tolerance_frames; 4 is measured for our corpora
balanced: true
# --- Optimisation -------------------------------------------------------
lr: 5e-4
weight_decay: 1e-4
batch_size: 16
trainer:
  max_epochs: 100
  accelerator: auto  # cpu | gpu | auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  monitor: val/f_beat  # any logged key; min/max is inferred from the name
# --- Data ---------------------------------------------------------------
# binary_only is folded into the split name, so it must match the split it is
# read with (`--binary-only` on tools/create_splits.py).
binary_only: true
train_subsample: null  # fraction of the training split, for smoke runs
data:
  input: merge  # split name, or a path containing "/" to a train.txt/val.txt folder
  exclude: []  # corpora to drop from that split, e.g. [jtd]
  sample_rate: 22050
  duration: 16.0  # seconds
  num_workers: 4
  random_crop: true  # train only; val is always a fixed window from the middle
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  pitch_shift:
    enabled: true
    min_semitones: -5.0
    max_semitones: 6.0
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
# --- Logging and outputs ------------------------------------------------
checkpoint_dir: checkpoints_beat/  # one subdirectory per run below this
event_metrics:  # val_event/*, decoded on full tracks; postprocessing comes from eval_beat.yaml
  enabled: true
  n_tracks: 50  # null scores the whole validation split
  every_n_epochs: 5
training_report:
  enabled: true
wandb:
  project: musicality-beat-phase
  run_name: null
  tags: []
