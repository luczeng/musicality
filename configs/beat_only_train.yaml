defaults:
  - model: tcn_frames_beat
  - _self_
# Declares which task this config trains, saved into the checkpoint's
# hyperparameters (BeatModule) and used by musicality.inference.detect_task to
# pick the right module class/postprocessing at eval/inference time.
task: beat_only

# Positive-class weight for the beat head's BCE loss, compensating for beat
# frames being a small fraction of all frames (~6:1 negative:positive on
# ballroom, measured directly from BeatDataset — see docs/beat_phase_pos_weight_notes.md).
pos_weight: 6.0
lr: 5e-4
weight_decay: 1e-4
# Balance the logged acc_beat metric (average of true-positive and
# true-negative rate) instead of a pooled mean, which is dominated by the
# true-negative rate since beat frames are a small minority.
balanced: true
batch_size: 2
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# Drop tracks whose beats-per-bar isn't a multiple of 2 (e.g. ballroom's
# waltz/Viennese waltz tracks, triple meter). Not required for a beat-only
# detector (meter doesn't affect the beat head), but kept as a lever for data
# selection. Must match whatever the split was built with, since it changes
# dataset length.
binary_only: false
train_subsample: null
# Parent directory for checkpoints — one subdirectory per run below it.
checkpoint_dir: checkpoints_beat_only/
trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
data:
  input: ballroom  # split name (looked up under splits_dir, see musicality.dataformats) or, if it contains a "/", a direct path to a folder with train.txt/val.txt
  sample_rate: 22050
  duration: 16.0
  num_workers: 4
  random_crop: true  # train: draw a random offset window per track each access; val is always a fixed window from the track's middle (avoids intros)
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
wandb:
  project: musicality-beat-only
  run_name: null
  tags: []
