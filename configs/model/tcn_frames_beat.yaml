# Dilated TCN, single frame-level beat head. Used by configs/beat_only_train.yaml.
_target_: musicality.models.tcn.TCNTempoNet
arch: TCN-frames-beat
n_mels: ${n_mels}
sample_rate: 22050
channels: 256
hop_length: ${hop_length}
n_layers: 8
dropout: 0.2

# Forced to true/1 by BeatModule; listed for documentation only.
frame_level: true
n_outputs: 1
