defaults:
  - model: TCN
  - _self_
loss: classification  # absolute | relative | classification
classification:
  bpm_min: 30
  bpm_max: 286
  n_bins: 256
  sigma: 1.5
lr: 5e-4  # learning rate
weight_decay: 0.0  # L2 regularisation
batch_size: 32
n_mels: 128
hop_length: 512
train_subsample: null  # fraction of the training split to use (e.g. 0.2), for quick smoke runs
# Parent directory for checkpoints — one subdirectory per run below it.
checkpoint_dir: checkpoints/
trainer:
  max_epochs: 100
  accelerator: auto  # cpu | gpu | auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
data:
  input: ballroom  # split name (looked up under splits_dir, see musicality.dataformats) or, if it contains a "/", a direct path to a folder with train.txt/val.txt
  sample_rate: 22050
  duration: 15.0  # audio clip length, in seconds
  num_workers: 4
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.75
    max_rate: 1.25
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
wandb:
  project: musicality
  run_name: null
  tags: []
