defaults:
  - model: tcn_frames_beat
  - _self_

# Positive-class weight for the beat head's BCE loss, compensating for beat
# frames being a small fraction of all frames (~6:1 negative:positive on
# ballroom, measured directly from BeatDataset — see docs/beat_phase_pos_weight_notes.md).
pos_weight: 6.0
lr: 5e-4
weight_decay: 0.0
# Balance the logged acc_beat metric (average of true-positive and
# true-negative rate) instead of a pooled mean, which is dominated by the
# true-negative rate since beat frames are a small minority.
balanced: true
batch_size: 16
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# Drop tracks whose beats-per-bar isn't a multiple of 2 (e.g. ballroom's
# waltz/Viennese waltz tracks, triple meter). Not required for a beat-only
# detector (meter doesn't affect the beat head), but kept as a lever for data
# selection. Must match whatever the split was built with, since it changes
# dataset length.
binary_only: false
train_subsample: null
checkpoint_dir: checkpoints_beat_only/
trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
data:
  name: ballroom
  data_home: ${hydra:runtime.cwd}/data/ballroom
  sample_rate: 22050
  duration: 10.0
  val_split: 0.2
  num_workers: 4
  random_crop: true  # train: draw a random offset window per track each access; val is always fixed at the clip start
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
wandb:
  project: musicality-beat-only
  run_name: null
  tags: []
