# Dilated TCN, frame-level beat/position heads. Used by configs/beat_train.yaml.
# Documented in docs/source/configuration.rst.
_target_: musicality.models.tcn.TCNTempoNet
arch: TCN-frames
n_mels: ${n_mels}
sample_rate: 22050
channels: 256
hop_length: ${hop_length}
n_layers: 8
dropout: 0.2

# Forced to true/3 by BeatPhaseModule; listed for documentation only.
frame_level: true
n_outputs: 3

# Off on purpose, not merely unexercised — see the docs before enabling.
use_self_attention: false
n_attn_layers: 1
n_attn_heads: 4

# 2D convolutional stem — plans/08 section 2.1, docs/source/configuration.rst.
# Off by default: it changes the first operation of the network, so turning it
# on is an experiment, not a tweak.
conv2d_stem: false
stem_channels: 16
stem_layers: 3
stem_freq_pool: 3
