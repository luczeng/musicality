# Tempo training (tools/train_tempo.py).
# Every key is documented in docs/source/configuration.rst — put explanations
# there, not here. Trailing comments list legal values only.
defaults:
  - model: tcn
  - _self_

# --- Loss ---------------------------------------------------------------
loss: classification  # absolute | relative | classification
classification:  # read by `loss: classification` only
  bpm_min: 30
  bpm_max: 286
  n_bins: 256
  sigma: 1.5

# --- Optimisation -------------------------------------------------------
lr: 5e-4
weight_decay: 0.0
batch_size: 32
n_mels: 128
hop_length: 512
trainer:
  max_epochs: 100
  accelerator: auto  # cpu | gpu | auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1

# --- Data ---------------------------------------------------------------
train_subsample: null  # fraction of the training split, for smoke runs
data:
  input: ballroom  # split name, or a path containing "/" to a train.txt/val.txt folder
  sample_rate: 22050
  duration: 15.0  # seconds
  num_workers: 4
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.75
    max_rate: 1.25
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005

# --- Logging and outputs ------------------------------------------------
checkpoint_dir: checkpoints/  # one subdirectory per run below this
wandb:
  project: musicality
  run_name: null
  tags: []
