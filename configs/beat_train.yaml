defaults:
  - model: tcn_frames
  - _self_

pos_weight: 8.0
lr: 5e-4
weight_decay: 0.0
batch_size: 16
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# Beats per group that the dataset's position annotations count across: 4 for a
# bar-position (1-4) dataset (e.g. ballroom), 8 for a phrase-position (1-8)
# dataset. Only changes what the "last" target/head means (positions == group_size);
# "one" is always position 1. Override on the CLI, e.g. `group_size=8 data.name=<phrase_dataset>`.
group_size: 4
train_subsample: null
checkpoint_dir: checkpoints_beat/
trainer:
  max_epochs: 100
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
data:
  name: ballroom
  data_home: ${hydra:runtime.cwd}/data/ballroom
  sample_rate: 22050
  duration: 10.0
  val_split: 0.2
  num_workers: 4
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
wandb:
  project: musicality-beat-phase
  run_name: null
  tags: []
