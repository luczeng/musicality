# Defaults for tools/eval_beat.py — every key below is overridable via the
# matching --flag on the command line (e.g. `--beat-threshold 0.4`).

dataset: ballroom  # mirdata dataset name
split: val  # train | val | all
val_split: 0.2  # fraction of the dataset held out for validation — must match how the split was created
sample_rate: 22050  # audio sample rate the checkpoint was trained at
hop_length: 512  # frame hop size, in samples — must match the checkpoint's training config
tolerance: 0.07  # F-measure matching window, seconds
device: cpu  # torch device to run inference on

# Postprocessing (musicality/postprocess.py) defaults, selected automatically by
# the checkpoint's detected task (musicality.inference.detect_task) unless
# overridden via the matching --flag.
beat_only:
  # Tuned via tools/sweep_beat_postprocess.py against a real checkpoint
  # (mean beat F-measure 0.735 -> 0.896) — rerun the sweep and update these if
  # the checkpoint/dataset changes materially.
  beat_threshold: 0.8  # pick_peaks: minimum probability to be considered a peak at all
  min_distance_frames: 4  # pick_peaks: minimum frame gap enforced between returned peaks
  gate_tolerance: 0.1  # gate_periodicity: relative slack around an integer multiple of the current beat period
beat_phase:
  # Tuned via tools/sweep_beat_postprocess.py against a real checkpoint
  # (checkpoints_beat/checkpoints_beat/lr_sweep/lr_0.03/beat-phase-epoch=126-val/loss=1.6565.ckpt,
  # binary_only=True, ballroom val split): mean beat F-measure 0.916,
  # mean('1','last') F-measure 0.695 (f_one=0.697 f_last=0.692 confusion=0.253)
  # — rerun the sweep and update these if the checkpoint/dataset changes materially.
  beat_threshold: 0.5  # pick_peaks: minimum probability to be considered a peak at all
  min_distance_frames: 4  # pick_peaks: minimum frame gap enforced between returned peaks
  gate_tolerance: 0.1  # gate_periodicity: relative slack around an integer multiple of the current beat period
  anchor_threshold: 0.8  # label_bar_position: minimum probability for a beat to be trusted as a confident "1"/"last" anchor
  group_size: 4  # beats per group: 4 for bar position (default), 8 for phrase position
