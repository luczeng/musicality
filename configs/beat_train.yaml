defaults:
  - model: tcn_frames
  - _self_
# Declares which task this config trains, saved into the checkpoint's
# hyperparameters (BeatPhaseModule) and used by musicality.inference.detect_task
# to pick the right module class/postprocessing at eval/inference time.
task: beat_phase
# Which frames the one/last BCE terms are averaged over.
#   mask — every frame of a position-annotated track (the original behaviour)
#   beat — only frames at or near a beat, weighted by the beat target channel
# `beat` matches how the heads are actually read at inference: postprocess's
# bar-position stage samples one/last *only* at detected beat times, so under
# `mask` ~96% of the phase gradient goes into re-learning "is this a beat at
# all" — which the beat head already does at 0.92 F. See
# docs/beat_phase_improvement_review.md step 2.
phase_conditioning: beat
# Positive-class weight for the beat/one/last BCE heads — scalar (shared across
# heads) or a 3-element list for per-head weights.
# COUPLED TO phase_conditioning — change both together or neither.
# Measured neg:pos mass on ballroom (binary_only, 150 tracks, 16s clips):
#
#   head   mask    beat
#   one    20.2     4.7
#   last   20.0     4.6
#   beat    4.3     4.3   (unconditioned either way)
#
# Note 4.7, not the naive 3.0 you get from "1 beat in 4 is a downbeat": the
# weight is the smeared beat channel and the target is the smeared one channel,
# so the positive mass is a product of two Gaussians (sum ~2.66 per downbeat)
# while the total weight is a single one (sum ~3.76 per beat). The positive
# side loses relatively more mass than the weight does.
# Values below follow the existing convention of shading ~10% under the
# measured ratio — exact inverse-frequency weighting on a soft target tends to
# overshoot into false positives.
pos_weight: [5, 4, 4]
lr: 5e-4  # learning rate
weight_decay: 1e-4  # L2 regularisation
# Balance the logged acc_beat/acc_one/acc_last metrics (average of true-positive
# and true-negative rate) instead of a pooled mean, which is dominated by the
# true-negative rate since beat/one/last frames are a small minority.
balanced: true
batch_size: 16
n_mels: 128
hop_length: 512
sigma_frames: 1.5
# Beats per group that the dataset's position annotations count across: 4 for a
# bar-position (1-4) dataset (e.g. ballroom), 8 for a phrase-position (1-8)
# dataset. Only changes what the "last" target/head means (positions == group_size);
# "one" is always position 1. Override on the CLI, e.g. `group_size=8 data.input=<phrase_dataset>`.
group_size: 4
# Drop tracks whose beats-per-bar isn't a multiple of 2 (e.g. ballroom's
# waltz/Viennese waltz tracks, which are in triple meter — 1, 2, 3 — rather
# than binary meter). Must match whatever the split was built with (see
# `--binary-only` on tools/create_splits.py), since it changes dataset length.
binary_only: true
train_subsample: null  # fraction of the training split to use (e.g. 0.2), for quick smoke runs
# Parent directory for checkpoints. Each run writes into its own
# subdirectory below this (named after wandb.run_name, or a timestamp when
# that is null), holding that run's trainer.save_top_k best checkpoints.
checkpoint_dir: checkpoints_beat/
trainer:
  max_epochs: 100
  accelerator: auto  # cpu | gpu | auto
  devices: 1
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
data:
  input: ballroom  # split name (looked up under splits_dir, see musicality.dataformats) or, if it contains a "/", a direct path to a folder with train.txt/val.txt
  sample_rate: 22050
  duration: 16.0  # audio clip length, in seconds
  num_workers: 4
  random_crop: true  # train: draw a random offset window per track each access; val is always a fixed window from the track's middle (avoids intros)
augmentations:
  enabled: true
  time_stretch:
    enabled: true
    min_rate: 0.85
    max_rate: 1.15
  gain:
    enabled: true
    min_db: -6.0
    max_db: 6.0
  noise:
    enabled: false
    std: 0.005
wandb:
  project: musicality-beat-phase
  run_name: null
  tags: []
